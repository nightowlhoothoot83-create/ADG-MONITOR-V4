name: Refresh live AdSense quality
on:
  push:
    branches: [repair/adsense-review-freeze-monitor-20260917]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh each live site audit without changing site code
        shell: bash
        run: |
          set -euo pipefail
          base="https://adg-monitor-v4.ascensiondigitalagency.workers.dev"
          for site in mycalctools mycalendartools wheel; do
            echo "Refreshing $site"
            curl -fsSL -L --max-time 180 "$base/quality/run?site=$site" >/dev/null
          done
          echo '=== refreshed quality summary ==='
          curl -fsSL "$base/quality.json" | jq '{run_at, sites: [.sites[] | {id,name,status,discovered_count,known_recent_count,thin_content_advisory_count,legacy_internal_link_count,shared_source_legacy_reference_count,generic_content_pattern_count,missing_unique_content_count,failed_pages: ([.pages[]? | select(.passed == false)] | length), issue_samples: ([.pages[]?.issues[]?] | .[:5])}]}'
