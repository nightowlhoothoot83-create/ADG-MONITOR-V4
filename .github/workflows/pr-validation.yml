name: ADG Monitor Branch Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'raven/**'
      - 'repair/**'

permissions:
  contents: read

concurrency:
  group: adg-monitor-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Check AdSense worker and guardian syntax
        run: npm run check
      - name: Check SaaS worker and guardian syntax
        run: npm run check:saas
