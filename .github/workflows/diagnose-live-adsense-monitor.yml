name: Diagnose live AdSense monitor
on:
  push:
    branches: [repair/adsense-review-freeze-monitor-20260917]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live monitor endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://adg-monitor-v4.ascensiondigitalagency.workers.dev"
          for path in /health /report.json /quality.json /guardian.json; do
            echo "===== ${base}${path} ====="
            curl -fsSL --max-time 30 "${base}${path}" || true
            echo
          done
